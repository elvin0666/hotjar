<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Replay</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/rrweb-player@latest/dist/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f5f5;
            height: 100vh;
            overflow: hidden;
        }

        #player {
            width: 100%;
            height: 100vh;
        }

        #loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-size: 18px;
            color: #666;
        }

        #error {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
            text-align: center;
        }

        #error h1 {
            color: #d32f2f;
            margin-bottom: 16px;
        }

        #error p {
            color: #666;
            max-width: 600px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="loading">Loading session replay...</div>
    <div id="error">
        <h1>Error Loading Replay</h1>
        <p id="error-message"></p>
    </div>
    <div id="player"></div>

    <script src="https://cdn.jsdelivr.net/npm/rrweb@latest/dist/rrweb.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/rrweb-player@latest/dist/index.js"></script>
    <script>
        // Get sessionId from query parameter
        function getSessionId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('sessionId');
        }

        // Show error message
        function showError(message) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').style.display = 'flex';
            document.getElementById('error-message').textContent = message;
        }

        // Fetch and replay session
        async function loadReplay() {
            const sessionId = getSessionId();

            if (!sessionId) {
                showError('No sessionId provided. Please add ?sessionId=... to the URL.');
                return;
            }

            try {
                // Fetch events from the API
                const response = await fetch(`/api/replay/events/${sessionId}`);

                if (!response.ok) {
                    throw new Error(`Failed to fetch events: ${response.status} ${response.statusText}`);
                }

                const batches = await response.json();

                if (!batches || batches.length === 0) {
                    showError('No event batches found for this session.');
                    return;
                }

                // Parse eventsJson field from each batch and concatenate into one array
                const events = [];
                for (const batch of batches) {
                    if (batch.eventsJson) {
                        // Parse the eventsJson string into an array
                        const batchEvents = JSON.parse(batch.eventsJson);
                        if (Array.isArray(batchEvents)) {
                            events.push(...batchEvents);
                        }
                    }
                }

                if (events.length === 0) {
                    showError('No events found in the batches.');
                    return;
                }

                // Hide loading message
                document.getElementById('loading').classList.add('hidden');

                // Create the player
                new rrwebPlayer({
                    target: document.getElementById('player'),
                    props: {
                        events: events,
                        autoPlay: false,
                        showController: true,
                        width: window.innerWidth,
                        height: window.innerHeight
                    }
                });

            } catch (error) {
                console.error('Error loading replay:', error);
                showError(error.message || 'An unexpected error occurred while loading the replay.');
            }
        }

        // Start loading when page is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadReplay);
        } else {
            loadReplay();
        }
    </script>
</body>
</html>
